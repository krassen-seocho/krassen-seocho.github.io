<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크라센 서초</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a66">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f8;font-family:'Noto Sans KR',system-ui,sans-serif;color:#141b38}
.box{text-align:center;padding:24px}
.spin{width:38px;height:38px;border:4px solid #d5dbec;border-top-color:#1b2a66;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
p{margin:6px 0;color:#4b5375;font-size:14px}
button,a.b{margin-top:14px;border:0;background:#1b2a66;color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;font-size:14px;text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><b>불러오는 중…</b><p>처음 열 때는 몇 초 걸릴 수 있어요.</p></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwFLEFtJGSrORQM4B9atmjGkJQGg5xjYxDLadDN2mnxiSqxnMpR1eHAK3smAV3cT4IH8g/exec';
  var KEY = 'krassen_selc_page_v1';
  function post(fn, args) {
    return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(function (r) { return r.json(); });
  }
  var SHIM = '(' + function (API) {
    function call(fn, args, ok, fail, uo) {
      fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) { if (ok) ok(j.result, uo); }
          else if (fail) fail(new Error((j && j.error) || '잠시 후 다시 시도해주세요.'), uo);
        }, function () { if (fail) fail(new Error('인터넷 연결을 확인하고 다시 시도해주세요.'), uo); });
    }
    function runner(ok, fail, uo) {
      return new Proxy({}, { get: function (_, k) {
        if (k === 'withSuccessHandler') return function (h) { return runner(h, fail, uo); };
        if (k === 'withFailureHandler') return function (h) { return runner(ok, h, uo); };
        if (k === 'withUserObject') return function (o) { return runner(ok, fail, o); };
        if (typeof k !== 'string') return undefined;
        return function () { call(k, Array.prototype.slice.call(arguments), ok, fail, uo); };
      } });
    }
    window.google = window.google || {};
    window.google.script = {
      run: runner(null, null, undefined),
      url: { getLocation: function (cb) {
        var p = {}, ps = {};
        new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; (ps[k] = ps[k] || []).push(v); });
        cb({ parameter: p, parameters: ps, hash: location.hash.slice(1) });
      } },
      host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
      history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} }
    };
  }.toString() + ')(' + JSON.stringify(API) + ');';
  var HOME = '<a href="./" aria-label="홈으로" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;background:rgba(27,42,102,.92);color:#fff;font:700 13px/1 sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ 홈</a>';
  var HEADX = '<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b2a66"><link rel="apple-touch-icon" href="icon-180.png">';
  function show(html) {
    html = html.replace(/<base[^>]*>/i, '');
    var tag = '<script>' + SHIM + '<\/script>';
    if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, function (m) { return m + tag + HEADX; });
    else html = tag + html;
    html = /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, HOME + '</body>') : html + HOME;
    document.open(); document.write(html); document.close();
  }
  function fail() {
    document.getElementById('box').innerHTML = '<b>화면을 불러오지 못했어요</b><p>인터넷 연결을 확인하고 다시 시도해주세요.</p><button onclick="location.reload()">다시 시도</button><br><a class="b" href="./" style="background:#8a93b3">홈으로</a>';
  }
  var cached = null; try { cached = localStorage.getItem(KEY); } catch (e) {}
  var fresh = post('__page').then(function (j) {
    if (!j || !j.ok || !j.result) throw new Error('page');
    try { localStorage.setItem(KEY, j.result); } catch (e) {}
    return j.result;
  });
  if (cached) { fresh.catch(function () {}); show(cached); }
  else fresh.then(show, fail);
})();
</script>
</body>
</html>
