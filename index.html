<style>
:root{--bg:#eef1f8;--surface:#fff;--ink:#141b38;--muted:#5b6385;--navy:#1b2a66;--line:#dfe3ef;--accent:#d93a2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--navy);color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 26px}
.brand{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.mark{width:38px;height:44px;background:#fff;color:var(--navy);font:900 24px/42px 'Noto Sans KR';text-align:center;clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.brand b{display:block;font-size:19px;letter-spacing:.14em;font-weight:900}
.brand small{font-size:13px;opacity:.75;letter-spacing:.12em}
main{max-width:560px;margin:0 auto;padding:22px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 2px 4px}
.lead{color:var(--muted);font-size:14px;margin:0 2px 18px}
.menu{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(20,27,56,.05);transition:transform .1s}
.item:active{transform:scale(.98)}
.ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.item h2{font-size:17px;margin:0 0 3px}
.item p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.item .go{margin-left:auto;color:#a2a9c4;font-size:22px}
#inst{margin-top:22px;text-align:center}
#inst-btn{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font:700 15px 'Noto Sans KR',sans-serif;color:var(--navy);cursor:pointer}
#inst-help{margin:10px 0 0;line-height:1.7;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
footer{text-align:center;color:#9aa1bd;font-size:12px;letter-spacing:.1em;margin-top:28px}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">K</div><div><b>KRASSEN</b><small>SEOCHO · 크라센 서초</small></div></div></header>
<main>
  <h1>무엇을 할까요?</h1>
  <p class="lead">아래에서 하려는 것을 눌러 주세요.</p>
  <nav class="menu">
    <a class="item" href="selc.html?app=hw"><span class="ico" style="background:#e8ecfa">📸</span><div><h2>숙제 인증</h2><p>숙제 사진 올리고 선생님 코멘트 확인</p></div><span class="go">›</span></a>
    <a class="item" href="selc.html"><span class="ico" style="background:#fbf1dc">📝</span><div><h2>SELC 후기</h2><p>TOEFL Junior · 모의고사 풀이 인증</p></div><span class="go">›</span></a>
    <a class="item" href="selc.html?page=zoom"><span class="ico" style="background:#e3f3ec">📚</span><div><h2>줌독서실</h2><p>입장 · 퇴장 체크와 공부 시간</p></div><span class="go">›</span></a>
    <a class="item" href="selc.html?page=hof"><span class="ico" style="background:#fde8e5">🏆</span><div><h2>명예의 전당</h2><p>열심히 공부한 친구들</p></div><span class="go">›</span></a>
  </nav>
  <div id="inst" hidden>
    <button type="button" id="inst-btn">📲 앱으로 설치하기</button>
    <p id="inst-help" hidden></p>
  </div>
  <footer>KRASSEN SEOCHO</footer>
</main>
<script>
(function () {
  var ua = navigator.userAgent, box = document.getElementById('inst'), btn = document.getElementById('inst-btn'), help = document.getElementById('inst-help');
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if (standalone) return;
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var kakao = /KAKAOTALK/i.test(ua), deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function () { box.hidden = true; });
  if (!/Mobi|Android|iPhone|iPad/i.test(ua) && !ios) return;
  box.hidden = false;
  function say(t) { help.innerHTML = t; help.hidden = false; }
  btn.onclick = function () {
    if (kakao) {
      if (ios) return say('카카오톡 안에서는 설치가 안 돼요.<br>오른쪽 아래 <b>⋯</b> 또는 공유 버튼 → <b>Safari로 열기</b>를 누른 뒤, 다시 이 버튼을 눌러 주세요.');
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); return;
    }
    if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; }); return; }
    if (ios) return say('① 사파리 아래쪽 <b>공유 버튼</b>(네모에 화살표 ↑)을 눌러요.<br>② <b>홈 화면에 추가</b>를 누르고 [추가]를 눌러요.<br>※ 사파리가 아닌 앱(카톡·네이버 등)에서 열었다면 먼저 사파리로 열어 주세요.');
    say('① 크롬 오른쪽 위 <b>⋮</b> 메뉴를 눌러요.<br>② <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 눌러요.<br>※ 크롬이 아닌 앱에서 열었다면 먼저 크롬으로 열어 주세요.');
  };
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
