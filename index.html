<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크라센 서초</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a66">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1f8;font-family:'Noto Sans KR',system-ui,sans-serif;color:#141b38}
.box{text-align:center;padding:24px}
.spin{width:38px;height:38px;border:4px solid #d5dbec;border-top-color:#1b2a66;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
p{margin:6px 0;color:#4b5375;font-size:14px}
button,a.b{margin-top:14px;border:0;background:#1b2a66;color:#fff;font-weight:700;padding:11px 18px;border-radius:10px;font-size:14px;text-decoration:none;display:inline-block}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><b>불러오는 중…</b><p>처음 열 때는 몇 초 걸릴 수 있어요.</p></div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwFLEFtJGSrORQM4B9atmjGkJQGg5xjYxDLadDN2mnxiSqxnMpR1eHAK3smAV3cT4IH8g/exec';
  var KEY = 'krassen_page_v3';
  try { ['krassen_selc_page_v1','krassen_hw_page_v1','krassen_page_v2'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
  function post(fn, args) {
    return fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(function (r) { return r.json(); });
  }
  var SHIM = '(' + function (API) {
    function call(fn, args, ok, fail, uo) {
      fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) { if (ok) ok(j.result, uo); }
          else if (fail) fail(new Error((j && j.error) || '잠시 후 다시 시도해주세요.'), uo);
        }, function () { if (fail) fail(new Error('인터넷 연결을 확인하고 다시 시도해주세요.'), uo); });
    }
    function runner(ok, fail, uo) {
      return new Proxy({}, { get: function (_, k) {
        if (k === 'withSuccessHandler') return function (h) { return runner(h, fail, uo); };
        if (k === 'withFailureHandler') return function (h) { return runner(ok, h, uo); };
        if (k === 'withUserObject') return function (o) { return runner(ok, fail, o); };
        if (typeof k !== 'string') return undefined;
        return function () { call(k, Array.prototype.slice.call(arguments), ok, fail, uo); };
      } });
    }
    window.google = window.google || {};
    window.google.script = {
      run: runner(null, null, undefined),
      url: { getLocation: function (cb) {
        var p = {}, ps = {};
        new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; (ps[k] = ps[k] || []).push(v); });
        cb({ parameter: p, parameters: ps, hash: location.hash.slice(1) });
      } },
      host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
      history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} }
    };
  }.toString() + ')(' + JSON.stringify(API) + ');';
  var HOME = '<a href="./" aria-label="홈으로" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;background:rgba(27,42,102,.92);color:#fff;font:700 13px/1 sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)">⌂ 홈</a>';
  var HEADX = '<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b2a66"><link rel="apple-touch-icon" href="icon-180.png"><script>(function(){var standalone=(window.matchMedia&&matchMedia(\'(display-mode: standalone)\').matches)||navigator.standalone;if(standalone)return;var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;var inApp=/KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line[/]/i.test(navigator.userAgent);var bip=null,btn=null;function css(){if(document.getElementById(\'kr-ins-css\'))return;var st=document.createElement(\'style\');st.id=\'kr-ins-css\';st.textContent=\'#kr-ins{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:99999;border:0;background:#c9a24d;color:#0e1a3d;font:700 14px/1 sans-serif;padding:12px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}#kr-ins-sh{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}#kr-ins-sh div{background:#fff;color:#111a33;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));font:15px/1.6 sans-serif}#kr-ins-sh b{font-size:17px;display:block;margin-bottom:8px}#kr-ins-sh ol{margin:0 0 14px;padding-left:20px}#kr-ins-sh button{width:100%;border:0;background:#0e1a3d;color:#fff;font-weight:700;padding:12px;border-radius:10px;font-size:15px}\';document.head.appendChild(st)}function sheet(html){var d=document.createElement(\'div\');d.id=\'kr-ins-sh\';d.innerHTML=\'<div>\'+html+\'<button type="button">확인</button></div>\';d.onclick=function(e){if(e.target===d||e.target.tagName===\'BUTTON\')d.remove()};document.body.appendChild(d)}function show(){if(btn||!document.body)return;css();btn=document.createElement(\'button\');btn.id=\'kr-ins\';btn.type=\'button\';btn.textContent=\'앱 설치\';btn.onclick=function(){ if(bip){bip.prompt();bip.userChoice.then(function(r){if(r&&r.outcome===\'accepted\'&&btn){btn.remove();btn=null}});bip=null;return} if(inApp){sheet(\'<b>크롬(안드로이드)·사파리(아이폰)로 열어 주세요</b>카톡 같은 앱 안에서는 설치가 안 돼요. 오른쪽 위 메뉴에서 <b style="display:inline;font-size:15px">다른 브라우저로 열기</b>를 누른 뒤 [앱 설치]를 눌러 주세요.\');return} if(ios){sheet(\'<b>아이폰에 앱 설치하기</b><ol><li>아래쪽 <b style="display:inline;font-size:15px">공유 버튼(네모에 위쪽 화살표)</b>을 눌러요</li><li><b style="display:inline;font-size:15px">홈 화면에 추가</b>를 눌러요</li><li>오른쪽 위 <b style="display:inline;font-size:15px">추가</b>를 누르면 끝!</li></ol>\');return} sheet(\'<b>안드로이드에 앱 설치하기</b><ol><li>크롬 오른쪽 위 <b style="display:inline;font-size:15px">⋮</b> 메뉴를 눌러요</li><li><b style="display:inline;font-size:15px">앱 설치</b> 또는 <b style="display:inline;font-size:15px">홈 화면에 추가 → 설치</b>를 눌러요</li></ol>\');};document.body.appendChild(btn)}window.addEventListener(\'beforeinstallprompt\',function(e){e.preventDefault();bip=e;show()});window.addEventListener(\'appinstalled\',function(){if(btn){btn.remove();btn=null}});if(document.readyState===\'loading\')document.addEventListener(\'DOMContentLoaded\',show);else setTimeout(show,0);})();<\/script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})<\/script>';
  function show(html) {
    html = html.replace(/<base[^>]*>/i, '');
    var tag = '<script>' + SHIM + '<\/script>';
    if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, function (m) { return m + tag + HEADX; });
    else html = tag + html;
    document.open(); document.write(html); document.close();
  }
  function fail() {
    document.getElementById('box').innerHTML = '<b>화면을 불러오지 못했어요</b><p>인터넷 연결을 확인하고 다시 시도해주세요.</p><button onclick="location.reload()">다시 시도</button><br>';
  }
  var cached = null; try { cached = localStorage.getItem(KEY); } catch (e) {}
  function getPage() { return post('hwAppPage').then(function (j) { if (!j || !j.ok || !j.result) throw new Error('page'); return j; }); }
  var fresh = getPage().catch(function () { return getPage(); }).then(function (j) {
    try { localStorage.setItem(KEY, j.result); } catch (e) {}
    return j.result;
  });
  function ready(f) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(f, 0); }); else setTimeout(f, 0); }
  if (cached) { fresh.catch(function () {}); ready(function () { show(cached); }); }
  else fresh.then(function (h) { ready(function () { show(h); }); }, fail);
})();
</script>
</body>
</html>
